# Julkaisee prototyypin GitHub Pagesiin. Sivusto on staattinen eikä sillä ole
# build-vaihetta, joten repon juuri viedään sellaisenaan.
name: Julkaise Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true kytkee Pagesin päälle jos sitä ei ole vielä kytketty.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
