          fill: "Laskutustapa: verkkolasku vai sähköposti (Linda)." },
        { q: "Miksi painotuotteen hinta on arvio?",
          a: "Vaihtelevan painon tuotteet, kuten kokonaiset lihat, hinnoitellaan punnitun painon mukaan. Kori näyttää arvion, lasku lopullisen hinnan." },
        { q: "Missä näen kampanjahinnat?",
          a: "Kampanjahinnat näkyvät suoraan tuoteriveillä: alennettu hinta, normaalihinta ja alennusprosentti. Erillistä kampanjasivua ei ole." }
      ] },
      { id: "tuotteet", chip: "Tuotteet", heading: "Tuotteet", items: [
        { q: "Mistä näen pakkauskoon ja säilyvyyden?",
          a: "Rivin Lue lisää avaa kuvauksen, ja tuotesivulla on pakkauskoko, säilyvyys, alkuperä ja ainesosat." },
        { q: "Miksi en löydä tuotetta, jonka tilasin aiemmin?",
          a: "Tuote ei ehkä ole saatavilla valitulle toimituspäivälle. Kokeile toista päivää tai poista suodatin Vain saatavilla. Jos tuote on poistunut valikoimasta, asiakaspalvelu auttaa löytämään korvaavan." },
        { q: "Voinko tilata tuotteita, joita ei ole kaupassa?",
          a: "Kysy asiakaspalvelusta. Osa tuotteista on saatavilla vain tilauksesta tai suuremmissa erissä.",
          fill: "Tilaustuotteiden käytäntö vahvistetaan Snellmanilta." },
        { q: "Onko tuotteista tuoteselosteita ravintolan omavalvontaan?",
          a: "Tuotesivulla on ainesosat ja ravintosisältö. Laajemmat tuotespesifikaatiot saat asiakaspalvelusta.",
          fill: "Oletuscopy. Tuoteselosteiden saatavuus vahvistetaan Snellmanilta." }
      ] }
    ]
  },

  /* ── S4 ── */
  noAnswer: {
    block: "core/group (#00522c) → core/heading H2 + core/paragraph + core/buttons × 2",
    heading: "Eikö vastaus löytynyt?",
    text: "Soita tai lähetä sähköpostia, autamme arkisin {aukioloaika}. Kerro tilausnumero, jos asia koskee tilausta.",
    call:  { label: "Soita {puhelinnumero}", href: "tel:{puhelinnumero}" },
    email: { label: "Lähetä sähköpostia",    href: "mailto:{sähköposti}" }
  },

  /* ── S5: 04-asiakaspalvelu.md v1.1 — puhuttelee nykyisiä ja uusia, lomake vain /tunnukset/-sivulla ── */
  becomeCustomer: {
    block: "core/group → core/columns 60/40 · sisältö kuten 01-etusivu.md A4, puhuttelee molempia",
    id: "asiakkaaksi",
    heading: "Ei vielä tunnuksia?",
    text: "Pyydä tunnukset lomakkeella. Jos tilaat jo Snellmanilta, riittää asiakasnumero tai y-tunnus.",
    cta: { label: "Pyydä tunnukset", href: "08-tunnukset.html" },
    contact: "Tai soita {puhelinnumero}, arkisin {aukioloaika}"
  },

  /* ── S6 ── */
  links: {
    block: "core/columns 2 → gds/card × 2, koko kortti linkki",
    ariaLabel: "Lisätietoa",
    cta: "Siirry",
    items: [
      { title: "Tilausehdot", text: "Minimitilaus, toimitusalue, muutokset, palautukset ja laskutus yhdellä sivulla.", href: "05-tilausehdot.html" },
      { title: "Snellman Outlet", text: "Lähellä päiväystä olevat erät edullisemmin. Näin osio toimii.",
        /* Kirjautunut ja oikeus: /outlet/. Muuten FAQ:n Boost ja Outlet -osio. */
        hrefOutlet: "03-snellman-outlet.html", hrefNoOutlet: "#outlet", ctaNoOutlet: "Lue vastaukset" }
    ]
  },

  /* Sisällön ylläpito: ohje sisällöntuottajalle, näkyy vain protossa */
  editorNote: {
    label: "Ohje sisällöntuottajalle (speksi: Sisällön ylläpito, lisätään sivupohjan editorinäkymään)",
    rules: [
      "Kysymys asiakkaan sanoin, ei Snellmanin termein. „Miksi tilaus tulee kahdessa osassa”, ei „Lastauspaikkojen reititys”.",
      "Vastaus enintään 3 lausetta. Ensimmäinen lause vastaa, toinen kertoo mitä tehdä, kolmas kertoo poikkeuksen.",
      "Jos vastaus vaatii yli 3 lausetta, kirjoita lyhyt vastaus ja linkitä tilausehtoihin.",
      "Älä käytä sanoja 2-laatu, GD, WOW, dumppaus, poistoerä."
    ]
  }
};
</script>

<body>
<a href="#main" class="skip" id="skiplink"></a>
<div class="proto"><div class="container" id="proto"></div></div>
<div id="shell-header"></div>
<div id="crumb"></div>
<main id="main"></main>
<div id="shell-footer"></div>


<!-- ══════════ RENDER ══════════ -->
<script>
(function () {
  "use strict";

  /* ─── Tila ────────────────────────────────────────────────────── */
  const KEY = "snellman-wf-04";
  const S = Object.assign({}, PROTO.defaults, readState());
  function readState() {
    let out = {};
    try { out = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { out = {}; }
    const q = new URLSearchParams(location.search);
    PROTO.controls.forEach((c) => { if (q.has(c.key)) out[c.key] = q.get(c.key); });
    return out;
  }
  function setState(k, v) {
    S[k] = v;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* privaatti-ikkuna */ }
    render();
  }
  const isB = () => S.view === "b";
  const hasOutlet = () => isB() && S.outlet === "yes";

  /* ─── Apurit ──────────────────────────────────────────────────── */
  const esc = SN.esc;
  /* S1:n ikonit (phone, envelope, truck): kirjaston SN.ICONS */
  const ico = SN.ico;

  /* Korvaa {muuttujat} demoarvoilla ja merkitsee ne dynaamisiksi. */
  function vars(str) {
    return String(str == null ? "" : str).replace(/\{([^{}]+)\}/g, function (m, key) {
      const v = PAGE.vars[key];
      if (v == null) return SN.render("fill", { text: key });
      return '<span class="var">' + esc(v) + '</span>';
    });
  }
  /* Sama ilman markkupia: URL:t. */
  const varsPlain = (str) => String(str == null ? "" : str)
    .replace(/\{([^{}]+)\}/g, (m, k) => (PAGE.vars[k] == null ? m : PAGE.vars[k]));
  /* tel:-linkeistä poistetaan välilyönnit. */
  function href(str) {
    const out = varsPlain(str);
    return out.indexOf("tel:") === 0 ? out.replace(/\s+/g, "") : out;
  }
  const fill = (t) => t ? SN.render("fill", { text: t, block: true }) : "";
  const btn = (o) => SN.render("button", o);

  function block(inner, o) {
    o = o || {};
    const id  = o.id ? ' id="' + esc(o.id) + '"' : "";
    const lab = o.labelledby ? ' aria-labelledby="' + esc(o.labelledby) + '"'
              : o.label ? ' aria-label="' + esc(o.label) + '"' : "";
    const mod = (o.variant ? " block--" + esc(o.variant) : "") + (o.tight ? " block--tight" : "") + (o.cls ? " " + o.cls : "");
    const dark = o.variant === "dark" ? " on-dark" : "";
    const cw = o.narrow ? " container--text" : "";
    return '<section class="block' + mod + dark + '"' + id + lab + '>' +
           '<div class="container' + cw + '">' + inner + "</div></section>";
  }

  /* ─── Proto-palkki ────────────────────────────────────────────── */
  function renderProto() {
    const meta = PROTO.meta.map((m) => "<span>" + esc(m) + "</span>")
      .join('<span aria-hidden="true">·</span>');
    const ctrls = PROTO.controls.filter((c) => !c.only || c.only === S.view).map(function (c) {
      const opts = c.opts.map((o) =>
        '<button type="button" data-k="' + esc(c.key) + '" data-v="' + esc(o.v) + '" aria-pressed="' +
        (S[c.key] === o.v) + '">' + esc(o.label) + "</button>").join("");
      return '<span class="ctrl"><span class="ctrl__label">' + esc(c.label) +
             '</span><span class="ctrl__opts">' + opts + "</span></span>";
    }).join("");
    document.getElementById("proto").innerHTML =
      '<div class="proto__title">' + PROTO.title + meta + "</div>" +
      '<div class="proto__ctrls"><span class="ctrl"><span class="ctrl__label">' +
      esc(PROTO.hint) + "</span></span>" + ctrls + "</div>" +
      '<div class="proto__legend">' + PROTO.legend.map((l) =>
        '<span><i class="lg lg--' + esc(l.cls) + '" aria-hidden="true"></i>' + esc(l.label) + "</span>"
      ).join("") + "</div>";
  }

  /* ─── Kehys kirjastosta: S0 header, murupolku, S7 footer ──────── */
  SN.SHELL.a.nav = SHELL.a.nav;
  SN.SHELL.a.cta = SHELL.a.cta;
  SN.SHELL.b.nav = SHELL.b.nav;
  SN.SHELL.b.cart.href = SHELL.b.cart.href;
  SN.SHELL.footer.links = SHELL.footer.links;
  SN.SHELL.footer.logout = SHELL.footer.logout;

  function renderShell() {
    document.documentElement.lang = SHELL.lang;
    document.title = PAGE.meta.title + " (wireframe)";
    document.getElementById("skiplink").textContent = SHELL.skip;
    SN.SHELL.home = isB() ? SHELL.home.b : SHELL.home.a;

    document.getElementById("shell-header").innerHTML = SN.render("header", {
      state: isB() ? "b" : "a", current: SHELL.current, outlet: S.outlet === "yes",
      search: true, cartCount: parseInt(PAGE.vars["rivimäärä"], 10) || 0 });

    const b = PAGE.breadcrumb;
    document.getElementById("crumb").innerHTML = '<div class="container crumb">' +
      SN.render("breadcrumb", { label: b.label, items: [
        { label: b.home.label, href: isB() ? b.home.hrefB : b.home.hrefA }, { label: b.current } ] }) + "</div>";

    document.getElementById("shell-footer").innerHTML = SN.render("footer", { loggedIn: isB() });
  }

  /* ═══════════ S1 Otsikko ja yhteystiedot ═══════════ */
  function renderIntro() {
    const c = PAGE.intro; if (!c) return "";
    const cards = c.cards.filter((k) => !k.requires || S[k.requires] === "yes").map((k) =>
      '<div class="card contact' + (k.variant ? " contact--" + esc(k.variant) : "") + '">' +
        '<span class="contact__ico">' + ico(k.icon) + "</span>" +
        "<h3>" + esc(k.title) + "</h3>" +
        '<p class="contact__value">' + vars(k.value) + "</p>" +
        '<p class="contact__sub">' + vars(k.sub) + "</p>" +
        btn({ labelHtml: vars(k.cta.label), href: href(k.cta.href) }) +
        fill(k.fill) +
      "</div>").join("");
    return block(
      '<div class="intro"><h1 id="page-title">' + esc(c.h1) + '</h1><p class="lead">' + esc(c.lead) + "</p></div>" +
      /* Korttien H3:t tarvitsevat H2:n (otsikkojärjestys H1 → H2 → H3) */
      '<h2 class="vh">' + esc(c.contactsLabel) + '</h2><div class="cols cols--3 contacts" role="group" aria-label="' + esc(c.contactsLabel) + '">' + cards + "</div>",
      { labelledby: "page-title", tight: true });
  }

  /* ═══════════ S2 Pikapolut ═══════════ */
  function renderToc() {
    const c = PAGE.toc, f = PAGE.faq; if (!c || !f) return "";
    const links = f.groups.map((g) =>
      SN.render("chip", { mode: "link", label: g.chip || g.heading, href: "#" + g.id })).join("");
    return block('<nav class="toc" aria-label="' + esc(c.ariaLabel) + '">' +
      '<span class="toc__label">' + esc(c.label) + "</span>" + links + "</nav>");
  }

  /* ═══════════ S3 FAQ ═══════════
     Kirjaston haitari: yksi auki per ryhmä, #ryhmä avaa ensimmäisen (ryhmä sisältää .acc:n).
     open: 0 pitää ankkurin kysymyksen auki myös, kun proto-palkki piirtää sivun uudelleen. */
  function renderFaq() {
    const c = PAGE.faq; if (!c || c.show === false) return "";
    const openAll = S.faq === "open";
    const groups = c.groups.map((g) =>
      '<div class="faq__group" id="' + esc(g.id) + '" role="group" aria-labelledby="faq-' + esc(g.id) + '">' +
        '<h2 id="faq-' + esc(g.id) + '">' + esc(g.heading) + "</h2>" +
        SN.render("accordion", { id: "faq-acc-" + g.id, single: !openAll, openAll: openAll,   /* kaikki auki: vapaa (Miro-vienti) */
          open: location.hash === "#" + g.id ? 0 : -1,
          items: g.items.map((it) => ({ q: it.q, a: "<p>" + vars(it.a) + "</p>" +
            (it.link ? "<p>" + btn({ variant: "text", label: it.link.label, href: it.link.href, icon: "arrow" }) + "</p>" : "") +
            fill(it.fill) })) }) +
      "</div>").join("");
    return block('<div class="faq__note">' + fill(c.fill) + '</div><div class="faq">' + groups + "</div>",
      { label: c.ariaLabel, narrow: true });
  }

  /* ═══════════ S4 Ei löytynyt vastausta ═══════════ */
  function renderNoAnswer() {
    const c = PAGE.noAnswer; if (!c) return "";
    return block('<div class="noanswer">' +
      '<h2 id="noanswer-title">' + esc(c.heading) + "</h2>" +
      '<p class="lead">' + vars(c.text) + "</p>" +
      '<div class="btns">' +
        btn({ labelHtml: vars(c.call.label), href: href(c.call.href), variant: "on-dark" }) +
        btn({ labelHtml: vars(c.email.label), href: href(c.email.href), variant: "outline-on-dark" }) +
      "</div></div>", { variant: "dark", labelledby: "noanswer-title" });
  }

  /* ═══════════ S5 Uusi asiakas (vain A) ═══════════ */
  function renderBecomeCustomer() {
    const c = PAGE.becomeCustomer; if (!c || isB()) return "";
    const inner =
      '<div class="cols cols--6040"><div>' +
        '<h2 id="become-title">' + esc(c.heading) + "</h2>" +
        '<p class="lead">' + esc(c.text) + "</p>" +
      "</div><div>" +
        btn({ label: c.cta.label, href: href(c.cta.href) }) +
        '<p class="become__contact">' + vars(c.contact) + "</p>" +
        fill(c.fill) +
      "</div></div>";
    /* Etusivulla A4 on tumma; tässä S4 on juuri edellä tumma, joten S5 saa pellavataustan
       jotta kaksi tummaa lohkoa eivät ole peräkkäin. Sisältö ja id ovat samat. */
    return block(inner, { variant: "block-bg", id: c.id, labelledby: "become-title", cls: "become" });
  }

  /* ═══════════ S6 Linkit ═══════════ */
  function renderLinks() {
    const c = PAGE.links; if (!c) return "";
    const cards = c.items.map((i) => {
      let target = i.href, cta = c.cta;
      if (i.hrefOutlet) {
        target = hasOutlet() ? i.hrefOutlet : i.hrefNoOutlet;
        cta = hasOutlet() ? c.cta : (i.ctaNoOutlet || c.cta);
      }
      /* Koko kortti on linkki, joten tekstipainike on ulkoasu (span), ei sisäkkäinen linkki. */
      return SN.render("card", { title: i.title, text: i.text, href: target, cta });
    }).join("");
    return block('<h2 class="vh">' + esc(c.ariaLabel) + '</h2><div class="cols cols--2">' + cards + "</div>", { label: c.ariaLabel });
  }

  /* Ohje sisällöntuottajalle: proto-tason muistio, ei osa sivua (ei TÄYTTÖ-etuliitettä). */
  function renderEditorNote() {
    const c = PAGE.editorNote; if (!c) return "";
    return block(SN.render("fill", { title: c.label, items: c.rules, prefix: "", text: "" }),
      { narrow: true, tight: true, cls: "editor-note" });
  }

  /* ─── Kokoaminen ──────────────────────────────────────────────── */
  function render() {
    renderProto();
    renderShell();
    document.getElementById("main").innerHTML = [
      renderIntro(), renderToc(), renderFaq(), renderNoAnswer(),
      renderBecomeCustomer(), renderLinks(), renderEditorNote()
    ].join("");
  }

  /* ─── Vuorovaikutus: proto-palkki. Haitari on kirjaston (SN.mount). ─ */
  document.addEventListener("click", function (e) {
    const b = e.target.closest("#proto button[data-k]");
    if (b) setState(b.dataset.k, b.dataset.v);
  });

  render();
  SN.mount(document);
})();
</script>
</body>
</html>
