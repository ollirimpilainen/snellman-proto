<main id="main"><section class="block block--tight" aria-labelledby="page-title"><div class="container"><div class="intro"><h1 id="page-title">Tilausehdot</h1><p class="lead">Nämä ehdot koskevat tilauksia Snellmanin tilauskanavassa. Ne täydentävät asiakassopimustasi. Alla lyhyt yhteenveto ja tarkemmat ehdot kohta kohdalta.</p><p class="intro__valid">Voimassa 1.11.2026 alkaen. Päivitetty 15.9.2026.</p></div><div class="summary"><h2 id="summary-title">Lyhyesti</h2><ul aria-labelledby="summary-title"><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Minimitilaus 150 € per toimitus. </span></li><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Tilaa viimeistään toimitusta edeltävänä arkipäivänä klo 12 ennen toimituspäivää. </span></li><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Muutokset ja peruutukset viimeistään toimitusta edeltävänä arkipäivänä klo 12 asiakaspalvelun kautta. </span></li><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Boost- ja Outlet-eriä ei voi palauttaa muuten kuin laatuvirheen vuoksi. </span></li><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Hinnat ilman alv, lasku asiakkuutesi maksuehdoilla. </span></li><li><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Tarkista toimitus vastaanotettaessa ja ilmoita puutteista toimituspäivänä.</span></li></ul></div></div></section><section class="block" id="ehdot" aria-label="Ehtokohdat"><div class="container"><div class="terms"><nav class="toc" aria-label="Sisällys"><p class="toc__label" aria-hidden="true">Sisällys</p><ol><li><a href="#soveltaminen" aria-current="true">Kenelle tilauskanava on</a></li><li><a href="#tunnukset">Tunnukset ja käyttäjät</a></li><li><a href="#tilaus">Tilauksen tekeminen</a></li><li><a href="#minimi">Minimitilaus</a></li><li><a href="#toimitus">Toimitus</a></li><li><a href="#muutokset">Tilauksen muuttaminen ja peruminen</a></li><li><a href="#hinnat">Hinnat ja laskutus</a></li><li><a href="#outlet">Boost- ja Outlet-erät</a></li><li><a href="#palautukset">Vastaanotto, puutteet ja palautukset</a></li><li><a href="#tietosuoja">Tietosuoja</a></li><li><a href="#muutokset-ehtoihin">Ehtojen muutokset ja yhteystiedot</a></li></ol></nav><div class="terms__body"><section class="term" id="soveltaminen" aria-labelledby="soveltaminen-title"><h2 id="soveltaminen-title">Kenelle tilauskanava on</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Tilauskanava on tarkoitettu Snellmanin yritysasiakkaille, joilla on voimassa oleva asiakkuus: itsenäisille lähikaupoille, kioskeille ja kahviloille. Tilaaminen edellyttää kirjautumista. Kanava ei ole tarkoitettu kuluttajille.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="tunnukset" aria-labelledby="tunnukset-title"><h2 id="tunnukset-title">Tunnukset ja käyttäjät</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Tunnukset ovat yrityskohtaisia, ja yritys vastaa niiden käytöstä. Pidä salasana omana tietonasi ja ilmoita heti, jos epäilet tunnusten joutuneen vääriin käsiin. Käyttäjien lisäys ja poisto hoidetaan asiakaspalvelun kautta.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="tilaus" aria-labelledby="tilaus-title"><h2 id="tilaus-title">Tilauksen tekeminen</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Tilaus syntyy, kun vahvistat sen yhteenvedossa ja saat vahvistuksen sähköpostiin. Tilaus tehdään valitulle toimituspäivälle, ja se pitää vahvistaa viimeistään toimitusta edeltävänä arkipäivänä klo 12 ennen toimitusta. Kalenteri näyttää vain päivät, joille ehdit tilata. Snellman voi jättää tilauksen toimittamatta, jos tuotetta ei ole saatavilla; silloin ilmoitamme siitä ennen toimitusta.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="minimi" aria-labelledby="minimi-title"><h2 id="minimi-title">Minimitilaus</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Minimitilaus on 150 € per toimitus ilman arvonlisäveroa. Jos tilaus toimitetaan kahdessa osassa, minimi koskee kumpaakin osaa erikseen. Kori kertoo, jos summa jää alle minimin, eikä tilausta voi silloin vahvistaa.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="toimitus" aria-labelledby="toimitus-title"><h2 id="toimitus-title">Toimitus</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Toimitamme koko Suomeen. Toimituspäivät riippuvat alueestasi ja näkyvät kalenterissa. Kokkikartanon valmisruoat toimitetaan Keravalta ja lihatuotteet Pietarsaaresta; jos toimituspäivät eroavat, näet molemmat ennen vahvistusta. Toimitus tapahtuu toimituspäivänä klo 7–15. Toimitus sisältyy hintaan.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="muutokset" aria-labelledby="muutokset-title"><h2 id="muutokset-title">Tilauksen muuttaminen ja peruminen</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Voit muuttaa tai perua tilauksen viimeistään toimitusta edeltävänä arkipäivänä klo 12 ottamalla yhteyttä asiakaspalveluun ja kertomalla tilausnumeron. Sen jälkeen tilaus on keräilyssä, eikä sitä voi enää muuttaa. Tilauskanavassa ei voi muokata vahvistettua tilausta itse.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="hinnat" aria-labelledby="hinnat-title"><h2 id="hinnat-title">Hinnat ja laskutus</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Hinnat näytetään ilman arvonlisäveroa. Hinta määräytyy valitun toimituspäivän mukaan; kampanja- ja Boost-hinnat ovat voimassa vain niille päiville, joille ne on merkitty. Vaihtelevan painon tuotteet laskutetaan punnitun painon mukaan, ja kori näyttää arvion. Tilaukset laskutetaan asiakkuutesi maksuehdoilla, ja lasku toimitetaan verkkolaskuna tai sähköpostilla.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="outlet" aria-labelledby="outlet-title"><h2 id="outlet-title">Boost- ja Outlet-erät</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Boost-erät ovat lähellä parasta ennen -päivää ja Outlet-erien päiväys ei riitä vähittäiskaupan hyllyyn. Molemmat myydään alennettuun hintaan, ja käytä viimeistään -päivä näkyy tuoterivillä. Erät ovat rajallisia ja myydään loppuun; jos erä loppuu ennen vahvistusta, tuote poistuu korista. Boost- ja Outlet-eriä ei voi palauttaa muuten kuin laatuvirheen vuoksi. Outlet-osio on käytössä vain asiakkaille, joille se on avattu.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="palautukset" aria-labelledby="palautukset-title"><h2 id="palautukset-title">Vastaanotto, puutteet ja palautukset</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Tarkista toimitus vastaanotettaessa: määrät, tuotteet ja lämpötila. Ilmoita puuttuvasta, virheellisestä tai vaurioituneesta tuotteesta asiakaspalveluun toimituspäivänä. Korvaamme tuotteen tai hyvitämme sen laskulla. Elintarvikkeita ei voi palauttaa muusta syystä, koska kylmäketjua ei voida varmistaa palautuksen jälkeen.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section><section class="term" id="tietosuoja" aria-labelledby="tietosuoja-title"><h2 id="tietosuoja-title">Tietosuoja</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Käsittelemme yhteyshenkilöiden tietoja tilausten hoitamiseen ja asiakassuhteen ylläpitoon. Tarkemmat tiedot ovat tietosuojaselosteessa.</p></div><ul class="term__links"><li><a class="btn-text" href="#"><span class="cap">Tietosuoja</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></li><li><a class="btn-text" href="#"><span class="cap">Yksityisyys ja evästeet</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></li></ul></section><section class="term" id="muutokset-ehtoihin" aria-labelledby="muutokset-ehtoihin-title"><h2 id="muutokset-ehtoihin-title">Ehtojen muutokset ja yhteystiedot</h2><div class="term__short"><p class="term__label">Lyhyesti</p><p>Voimme päivittää näitä ehtoja. Muutoksista ilmoitetaan tilauskanavassa ja sähköpostilla ennen voimaantuloa, ja uudet ehdot koskevat niiden voimaantulon jälkeen tehtyjä tilauksia. Kysymyksissä auttaa asiakaspalvelu: asiakaspalvelu@snellman.fi, arkisin 8–16.</p></div><div class="term__short term__full"><p class="term__label">Ehto</p><p class="term__ph">[Varsinainen ehtoteksti Snellmanin juridiikalta.]</p></div></section></div></div></div></section><section class="block block--block-bg support" aria-label="Tuki"><div class="container"><div class="cols cols--2"><div><a class="card card--link" href="#"><h3>Asiakaspalvelu ja usein kysytyt kysymykset</h3><p>Jos ehdot eivät vastanneet kysymykseesi, katso vastaukset tai ota yhteyttä.</p><span class="card__go"><span class="btn-text"><span class="cap">Siirry</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a></div><div><a class="card card--link" href="#"><h3>Tulostettava versio</h3><p>Lataa tilausehdot PDF-muodossa.</p><span class="card__go"><span class="btn-text"><span class="cap">Lataa PDF</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a></div></div></div></section></main>
