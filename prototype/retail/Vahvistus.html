<div>
<h1>Kiitos, tilaus on vastaanotettu</h1>
<p><strong>Tilausnumero 100482. Vahvistus on lähetetty osoitteeseen tilaukset@toivola.fi.</strong></p>

<div class="addr addr--row"><div><div class="lbl">Toimitusosoite</div>Kyläkauppa Toivola, Toivolankatu 12, 04200 Kerava</div></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div class="ship">
<div class="ship__head"><h3>{{g.name}}<span class="group__date">{{g.date}}</span></h3></div>
<ul class="lines">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<li><span class="nm"><sc-if value="{{r.badge}}" hint-placeholder-val="{{false}}"><span class="{{r.badgeCls}}" role="img" aria-label="{{r.badgeAria}}">{{r.badge}}</span></sc-if>{{r.name}}</span><span class="q">{{r.qty}}</span><span class="s">{{r.sum}}</span></li>
</sc-for>
</ul>
</div>
</sc-for>

<div id="app"></div>
<script src="assets/proto.js?v=20261014f"></script>
<script>
class Component extends DCLogic {
renderVals() {
function r(name, qty, sum, kind, badge, aria) {
  return { name: name, qty: qty, sum: sum, badge: badge || "", badgeCls: "badge badge--" + (kind || "normal"), badgeAria: aria || "" };
}
return { groups: [
  { name: "Kokkikartanon valmisruoat", date: "ke 24.9.2026", rows: [
    r("Tomaatti-vuohenjuustopasta 300g", "12 pakk.", "31,80 €"),
    r("Possu-pekonikast. muusilla 300g", "12 pakk.", "27,36 €", "campaign", "−15 %", "Kampanjahinta, alennus 15 prosenttia"),
    r("Mango-chilibroileri riisiä 300g", "10 pakk.", "16,50 €", "boost", "Boost", "Boost-erä, alennus 30 prosenttia"),
    r("Pippurihärkää riisillä 300g", "12 pakk.", "28,92 €")
  ] },
  { name: "Lihatuotteet", date: "to 25.9.2026", rows: [
    r("Porsaan ulkofilee n1,3kg", "2 pakk.", "n. 21,66 €", "boost", "Boost", "Boost-erä, alennus 30 prosenttia"),
    r("Kunnon grillimakkara 400g", "10 pakk.", "27,30 €", "boost", "Boost", "Boost-erä, alennus 30 prosenttia"),
    r("Kotimainen meetvursti 220g", "6 pakk.", "18,60 €")
  ] }
] };
}
}

window.Component = Component;</script>
