<main id="main"><section class="block block--tight intro" aria-labelledby="page-title"><div class="container"><h1 id="page-title">Snellman Outlet</h1><p class="lead">Lähellä päiväystä olevat erät edullisemmin. Erät päivittyvät päivittäin, ja määrät ovat rajalliset. Hinnat alv 0 %.</p><div class="odate"><div class="warehouse"><button type="button" class="warehouse__button" aria-controls="wf-cal" aria-expanded="false" id="wf-date"><span class="cap">Toimituspäivä: ke 24.9.2026</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7" stroke-width="2.5"></path></svg></span></button></div><div class="cal" id="wf-cal" hidden=""><h3 class="cal__h" id="wf-cal-h">Valitse toimituspäivä</h3><div class="cal__days" role="radiogroup" aria-labelledby="wf-cal-h"><button type="button" class="cal__day" role="radio" aria-checked="false" tabindex="-1" aria-label="ma 22.9."><span class="cal__wd">ma</span><span class="cal__n">22.9.</span></button><button type="button" class="cal__day" role="radio" aria-checked="false" tabindex="-1" aria-label="ti 23.9."><span class="cal__wd">ti</span><span class="cal__n">23.9.</span></button><button type="button" class="cal__day" role="radio" aria-checked="true" tabindex="0" aria-label="ke 24.9."><span class="cal__wd">ke</span><span class="cal__n">24.9.</span></button><button type="button" class="cal__day" role="radio" aria-checked="false" tabindex="-1" aria-label="to 25.9."><span class="cal__wd">to</span><span class="cal__n">25.9.</span></button><button type="button" class="cal__day" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" aria-label="pe 26.9., ei Outlet-lähtöä"><span class="cal__wd">pe</span><span class="cal__n">26.9.</span><span class="cal__reason" aria-hidden="true">ei Outlet-lähtöä</span></button></div><p class="cal__cutoff" aria-live="polite">Tilaa viimeistään ti 23.9. klo 14</p><p class="cal__note"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"></circle><path d="M12 11v6"></path><circle cx="12" cy="7.75" r=".6" fill="currentColor"></circle></svg></span><span>Toimituspäivän vaihto voi vaikuttaa tuotteiden saatavuuteen.</span></p></div></div></div></section><section class="block block--tight" aria-label="Erätyypit"><div class="container"><p class="legend__summary">Boost noin −30 % ja Outlet noin −50 %: samoja tuotteita lyhyemmällä käyttöajalla.</p><div class="acc" id="erat"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="erat-p0"><span>Mitä Boost- ja Outlet-erät ovat?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="erat-p0" hidden="until-found"><div class="cols cols--2"><div class="card legend legend--boost"><span class="badge badge--boost" aria-hidden="true">Boost</span><h4>Boost-erät, noin −30 %</h4><p>Tuote on lähellä parasta ennen -päivää ja myydään siksi alennettuun hintaan. Sama tuote, sama varasto, lyhyempi käyttöaika. Sopii, kun tuote menee käyttöön muutaman päivän sisällä.</p></div><div class="card legend legend--outlet"><span class="badge badge--outlet" aria-hidden="true">Outlet</span><h4>Outlet-erät, noin −50 %</h4><p>Tuotteen päiväys ei enää riitä vähittäiskaupan hyllyyn, mutta tuote on täysin käyttökelpoinen. Erät ovat kertaluonteisia ja loppuvat, kun ne on myyty.</p></div></div></div></div></div></div></section><section class="block block--list" id="erat" aria-label="Erät"><div class="container"><div class="controls" role="group" aria-label="Suodatus ja järjestys"><div class="controls__bar"><button type="button" class="con ökelpoinen, siksi −50 %. Käytä viimeistään 25.9.2026.</p><p class="pinfo__desc">Perinteinen ja herkullinen lohikeitto. Ainesten lista on lyhyt, mutta siksi jokainen aines on tärkeä. Kaikilla niillä on oma, tunnistettava maku ja luonne. Ei tarvita lisäaineita tai aromeja. Kaikki on reilua ja yksinkertaista. Tähän keittoon keittelimme kalaliemenkin itse. Siten siitä saatiin juuri niin täyteläistä ja hyvää kuin halusimme.</p><ul class="pinfo__diet" aria-label="Ruokavaliot"><li><span class="diet" aria-hidden="true">L</span>Laktoositon</li><li><span class="diet" aria-hidden="true">G</span>Gluteeniton</li></ul><section class="pinfo__sec"><h4 class="pinfo__h">Ainesosat</h4><p>Peruna, lohi 18  % (Norja), suomalainen <b>KERMA</b>, vesi, kalaliemi (vesi, kalanruodot (<b>KIRJOLOHI</b>) sipuli, porkkana, fenkoli, laakerinlehti, suola), sipuli, suomalainen <b>VOI</b>, jodioitu suola, tilli, maustepippuri, laakerinkehti. Tuote saattaa sisältää ruotoja.</p><p class="pinfo__alg">Allergeenit: Kalat ja kalatuotteet, Maito ja maitotuotteet (laktoosi mukaan lukien)</p></section><section class="pinfo__sec"><h4 class="pinfo__h">Valmistusohje</h4><p>Kuumenna pakkauksessaan höyrykeitossa 90 °C n. 20 minuuttia tai tyhjennä kattilaan ja kuumenna</p></section></div></div></div></div></div></li><li class="cell"><div class="genero-product-card pch pch-b pch--outlet"><div class="pch-b__card"><div class="pch-b__img"><div class="pch-media"><img class="pch-img" src="assets/img/22442.jpg" alt=""><span class="badge badge--outlet" role="img" aria-label="Outlet-erä, alennus 50 prosenttia">Outlet −50 %</span></div></div><div class="pch-b__info"><h3 class="pch__title"><a href="#">Lihapyörykät tom.kastikkeessa 2500g</a></h3><p class="pch-x__meta">Tuotenumero 22442</p><button type="button" class="pch-x__more-text" aria-expanded="false" aria-controls="row-6-content" aria-label="Lisätiedot: Lihapyörykät tom.kastikkeessa 2500g"><span class="cap">Lisätiedot</span><span class="ico" aria-hidden="true"><svg viewB p>Kinkku (alkuperä Suomi), vesi, suola, stabilointiaineet (E450, E451), sokeri, mausteet (mustapippuri, valkopippuri, korianteri, sipuli, palsternakka), hapettumisenestoaine (E301), säilöntäaine (E250).</p></section></div></div></div></div></div></li></ul></div></section><section class="block block--block-bg how" aria-labelledby="how-title"><div class="container container--text"><h2 id="how-title">Näin Outlet toimii</h2><details class="how-acc"><summary>Miksi erät ovat edullisempia?<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;"><path d="M5 9l7 7 7-7"></path></svg></span></summary><div class="how-acc__body"><p>Boost-erät ovat lähellä parasta ennen -päivää, ja Outlet-erien päiväys ei enää riitä vähittäiskaupan hyllyyn. Tuotteet ovat samoja kuin normaalivalikoimassa ja täysin käyttökelpoisia. Hinta on alempi, koska haluamme, että tuote menee käyttöön eikä hukkaan.</p></div></details><details class="how-acc"><summary>Miten näen, ehdinkö käyttää tuotteen?<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;"><path d="M5 9l7 7 7-7"></path></svg></span></summary><div class="how-acc__body"><p>Jokaisella rivillä näkyy käytä viimeistään -päivä ja toimituspäivä. Erät näytetään vain, jos ne ehtivät perille ennen käyttöpäivää. Vertaa päivää omaan menekkiisi ennen tilausta.</p></div></details><details class="how-acc"><summary>Voinko palauttaa Outlet-tuotteen?<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;"><path d="M5 9l7 7 7-7"></path></svg></span></summary><div class="how-acc__body"><p>Outlet- ja Boost-erät myydään loppuun, eikä niitä voi palauttaa muuten kuin laatuvirheen vuoksi. Jos tuotteessa on virhe, ota yhteyttä asiakaspalveluun toimituspäivänä.</p></div></details></div></section><section class="block" aria-label="Tuki"><div class="container"><div class="cols cols--2"><a class="card card--link" href="#"><h3>Asiakaspalvelu ja usein kysytyt kysymykset</h3><p>Toimitukset, tuotteet, tunnukset. Vastaukset yleisimpiin kysymyksiin ja yhteystiedot.</p><span class="card__go"><span class="btn-text"><span class="cap">Siirry</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a><a class="card card--link" href="#"><h3>Tilausehdot</h3><p>Minimitilaus, toimitusalue, tilauksen muuttaminen ja peruminen.</p><span class="card__go"><span class="btn-text"><span class="cap">Siirry</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a></div></div></section></main>
