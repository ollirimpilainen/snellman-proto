ilitiedot</a></li><li class="is-sep"><a href="EtusivuA.html">Kirjaudu ulos</a></li></ul></div><a class="util util--cart" href="Ostoskori.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h2.5l2.4 11h10.4L20.5 8H6"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg></span><span class="cap">Kori</span><span class="util__count" aria-hidden="true"><span class="cap">7</span></span><span class="vh">, 7 tuotetta</span></a><button type="button" class="menu-toggle" aria-expanded="false" aria-controls="nav-1"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span><span class="cap">Valikko</span></button></div></div></header>

<main id="main"><section class="block block--tight" aria-labelledby="page-title"><div class="container"><div class="intro"><h1 id="page-title">Asiakaspalvelu</h1><p class="lead">Autamme tilaamisessa, toimituksissa ja tunnuksissa. Yleisimpiin kysymyksiin löydät vastauksen alta, muuten ota yhteyttä.</p></div><h2 class="vh">Yhteystiedot</h2><div class="cols cols--3 contacts" role="group" aria-label="Yhteystiedot"><div class="card contact"><span class="contact__ico"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"></path></svg></span></span><h3>Soita</h3><p class="contact__value">Asiakaspalvelu</p><p class="contact__sub">Arkisin ma–pe 8–16</p><a class="btn btn--primary" href="#"><span class="cap">Soita asiakaspalveluun</span></a></div><div class="card contact"><span class="contact__ico"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></span></span><h3>Lähetä sähköpostia</h3><p class="contact__value">asiakaspalvelu@snellman.fi</p><p class="contact__sub">Vastaamme viimeistään seuraavana arkipäivänä.</p><a class="btn btn--primary" href="mailto:asiakaspalvelu@snellman.fi"><span class="cap">Lähetä sähköpostia</span></a></div><div class="card contact contact--urgent"><span class="contact__ico"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h11v10H3zM14 10h4l3 3.5v3h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></span></span><h3>Kiireellinen toimitusasia</h3><p class="contact__value">Soita toimituspäivänä asiakaspalveluun</p><p class="contact__sub">Puuttuva tai virheellinen toimitus, lämpötilapoikkeama.</p><a class="btn btn--primary" href="#"><span class="cap">Soita asiakaspalveluun</span></a></div></div></div></section><section class="block"><div class="container"><nav class="toc" aria-label="Kysymysten aiheet"><span class="toc__label">Mistä haluat tietää lisää?</span><a class="selection selection--link" href="#tunnukset"><span class="cap">Tunnukset ja asiakkuus</span></a><a class="selection selection--link" href="#tilaaminen"><span class="cap">Tilaaminen</span></a><a class="selection selection--link" href="#toimitus"><span class="cap">Toimitus</span></a><a class="selection selection--link" href="#outlet"><span class="cap">Boost ja Outlet</span></a><a class="selection selection--link" href="#hinnat"><span class="cap">Hinnat ja laskutus</span></a><a class="selection selection--link" href="#tuotteet"><span class="cap">Tuotteet</span></a></nav></div></section><section class="block" aria-label="Usein kysytyt kysymykset"><div class="container container--text"><div class="faq__note"></div><div class="faq"><div class="faq__group" id="tunnukset" role="group" aria-labelledby="faq-tunnukset"><h2 id="faq-tunnukset">Tunnukset ja asiakkuus</h2><div class="acc" id="faq-acc-tunnukset"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p0"><span>Kenelle tilauskanava on tarkoitettu?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p0" hidden="until-found"><p>Itsenäisille lähikaupoille, kioskeille ja kahviloille, jotka tilaavat Snellmanin tuotteita suoraan. Suuret ketjut tilaavat omien järjestelmiensä kautta.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p1"><span>Miten saan tunnukset?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p1" hidden="until-found"><p>Pyydä tunnukset lomakkeella. Saat sähköpostiin linkin, jolla asetat salasanan, yleensä 1–2 arkipäivän kuluessa. Voit pyytää tunnukset myös soittamalla.</p><p><a class="btn-text" href="#"><span class="cap">Pyydä tunnukset</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p2"><span>Tilaan jo Snellmanilta puhelimella. Miten pääsen tilaamaan verkosta?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p2" hidden="until-found"><p>Lähetämme nykyisille asiakkaille sähköpostiin linkin, jolla asetat salasanan. Jos viestiä ei ole tullut, pyydä tunnukset. Riittää, että kerrot asiakasnumeron tai y-tunnuksen.</p><p><a class="btn-text" href="#"><span class="cap">Pyydä tunnukset</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p3"><span>Voiko yrityksellä olla useita käyttäjiä?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p3" hidden="until-found"><p>Kyllä. Kirjaudu ja pyydä lisäkäyttäjä lomakkeella. Kaikki käyttäjät näkevät saman tilaushistorian.</p><p><a class="btn-text" href="#"><span class="cap">Pyydä lisäkäyttäjä</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p4"><span>Unohdin salasanani</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p4" hidden="until-found"><p>Klikkaa etusivun kirjautumislomakkeessa Unohtuiko salasana ja anna sähköpostisi. Saat linkin uuden salasanan asettamiseen. Jos et saa viestiä, tarkista roskaposti tai ota yhteyttä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tunnukset-p5"><span>Miten päivitän yhteystiedot tai toimitusosoitteen?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tunnukset-p5" hidden="until-found"><p>Ilmoita muutos asiakaspalveluun. Osoitetiedot päivitetään Snellmanin järjestelmään, jotta ne ovat oikein myös laskulla ja kuljetuksessa.</p></div></div></div></div><div class="faq__group" id="tilaaminen" role="group" aria-labelledby="faq-tilaaminen"><h2 id="faq-tilaaminen">Tilaaminen</h2><div class="acc" id="faq-acc-tilaaminen"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p0"><span>Miksi minun pitää valita toimituspäivä ennen tilaamista?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p0" hidden="until-found"><p>Saatavuus ja hinnat riippuvat toimituspäivästä. Kun päivä on valittu, näet vain tuotteet, jotka voidaan toimittaa silloin, ja hinnat ovat oikeat.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p1"><span>Miten tilaan saman kuin viimeksi?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p1" hidden="until-found"><p>Kirjautuneena etusivulla on kortti Tilaa uudelleen. Se lisää edellisen tilauksen tuotteet koriin valitulle toimituspäivälle. Tarkista määrät ennen vahvistusta.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p2"><span>Onko minimitilausta?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p2" hidden="until-found"><p>Minimitilaus on 150 euroa per toimitus. Kori kertoo, jos summa jää alle.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p3"><span>Voinko muuttaa tai perua tilauksen?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p3" hidden="until-found"><p>Kyllä, viimeistään klo 12 toimitusta edeltävänä arkipäivänä. Ota yhteyttä asiakaspalveluun ja kerro tilausnumero. Sen jälkeen tilaus on jo keräilyssä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p4"><span>Mihin aikaan tilauksen pitää olla sisällä?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p4" hidden="until-found"><p>Tilaus pitää vahvistaa viimeistään klo 12 edellisenä arkipäivänä ennen toimituspäivää. Kalenteri näyttää vain päivät, joille ehdit tilata.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tilaaminen-p5"><span>Saanko vahvistuksen?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tilaaminen-p5" hidden="until-found"><p>Kyllä, sähköpostiin heti tilauksen jälkeen. Vahvistuksessa näkyy tilausnumero, tuotteet ja toimituspäivät. Löydät tilaukset myös kohdasta Tilaukset.</p></div></div></div></div><div class="faq__group" id="toimitus" role="group" aria-labelledby="faq-toimitus"><h2 id="faq-toimitus">Toimitus</h2><div class="acc" id="faq-acc-toimitus"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p0"><span>Miksi tilaukseni tulee useammassa osassa?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p0" hidden="until-found"><p>Kokkikartanon valmisruoat, lihatuotteet ja Outlet-erät lähtevät eri paikoista, ja jokaisella on oma toimituspäivänsä. Kori ja vahvistus näyttävät jokaisen toimituksen erikseen. Voit tilata kaikki samalla kertaa.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p1"><span>Minne toimitatte?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p1" hidden="until-found"><p>Toimitamme koko Suomeen. Toimituspäivät vaihtelevat alueen mukaan, ja kalenteri näyttää oman alueesi päivät.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p2"><span>Mihin aikaan toimitus tulee?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p2" hidden="until-found"><p>Toimitusaika riippuu reitistä. Toimitus tulee toimituspäivänä klo 7–15. Voit kirjoittaa toimitustoiveen yhteenvedon Viesti toimitukseen -kenttään.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p3"><span>Maksaako toimitus?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p3" hidden="until-found"><p>Toimitus sisältyy hintaan.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p4"><span>Tuote puuttui tai oli virheellinen</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p4" hidden="until-found"><p>Soita asiakaspalveluun toimituspäivänä ja kerro tilausnumero ja tuote. Korvaamme puuttuvan tai virheellisen tuotteen tai hyvitämme sen laskulla.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-toimitus-p5"><span>Miten kylmäketju hoidetaan?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-toimitus-p5" hidden="until-found"><p>Tuotteet toimitetaan kylmäkuljetuksena ja lämpötila valvotaan matkan ajan. Tarkista toimitus vastaanotettaessa ja ilmoita poikkeamista heti.</p></div></div></div></div><div class="faq__group" id="outlet" role="group" aria-labelledby="faq-outlet"><h2 id="faq-outlet">Boost ja Outlet</h2><div class="acc" id="faq-acc-outlet"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p0"><span>Mitä Boost-erät ovat?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p0" hidden="until-found"><p>Tuotteita, jotka ovat lähellä parasta ennen -päivää ja myydään siksi alennettuun hintaan. Sama tuote, sama varasto, lyhyempi käyttöaika. Näkyvät kategorioissa BOOST-merkinnällä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p1"><span>Mitä Outlet-erät ovat?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p1" hidden="until-found"><p>Tuotteita, joiden päiväys ei enää riitä vähittäiskaupan hyllyyn, mutta jotka ovat täysin käyttökelpoisia. Myydään omassa Snellman Outlet -osiossa selvästi alennettuun hintaan.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p2"><span>Miten saan Snellman Outletin käyttööni?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p2" hidden="until-found"><p>Outlet avataan asiakkaille, jotka haluavat ostaa eriä. Pyydä käyttöoikeus asiakaspalvelusta. Oikeus näkyy kaupassa yleensä seuraavana arkipäivänä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p3"><span>Saanko tiedon uusista eristä?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p3" hidden="until-found"><p>Kyllä. Outlet-asiakkaat saavat sähköpostin, kun uusia eriä tulee myyntiin. Voit perua ilmoitukset viestin lopussa olevasta linkistä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p4"><span>Miksi Outlet-erä katosi korista?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p4" hidden="until-found"><p>Erät ovat rajallisia ja myydään loppuun. Jos toinen asiakas osti erän ennen kuin vahvistit tilauksen, tuote poistuu korista ja kori kertoo siitä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-outlet-p5"><span>Voinko palauttaa Boost- tai Outlet-tuotteen?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-outlet-p5" hidden="until-found"><p>Boost- ja Outlet-eriä ei voi palauttaa muuten kuin laatuvirheen vuoksi. Tarkista käytä viimeistään -päivä ennen tilausta.</p></div></div></div></div><div class="faq__group" id="hinnat" role="group" aria-labelledby="faq-hinnat"><h2 id="faq-hinnat">Hinnat ja laskutus</h2><div class="acc" id="faq-acc-hinnat"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-hinnat-p0"><span>Sisältävätkö hinnat arvonlisäveron?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-hinnat-p0" hidden="until-found"><p>Hinnat näytetään ilman arvonlisäveroa. Alv lisätään korin yhteenvedossa ja laskulla.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-hinnat-p1"><span>Miksi hinta muuttui, kun vaihdoin toimituspäivää?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-hinnat-p1" hidden="until-found"><p>Kampanja- ja Boost-hinnat ovat voimassa tietyille toimituspäiville. Kori kertoo, jos hinta päivittyi.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-hinnat-p2"><span>Miten maksan?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-hinnat-p2" hidden="until-found"><p>Tilaukset laskutetaan asiakkuutesi maksuehdoilla. Lasku tulee verkkolaskuna tai sähköpostiin. Kaupassa ei makseta kortilla.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-hinnat-p3"><span>Miksi painotuotteen hinta on arvio?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-hinnat-p3" hidden="until-found"><p>Vaihtelevan painon tuotteet, kuten kokonaiset lihat, hinnoitellaan punnitun painon mukaan. Kori näyttää arvion, lasku lopullisen hinnan.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-hinnat-p4"><span>Missä näen kampanjahinnat?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-hinnat-p4" hidden="until-found"><p>Kampanjahinnat näkyvät suoraan tuoteriveillä: alennettu hinta, normaalihinta ja alennusprosentti. Erillistä kampanjasivua ei ole.</p></div></div></div></div><div class="faq__group" id="tuotteet" role="group" aria-labelledby="faq-tuotteet"><h2 id="faq-tuotteet">Tuotteet</h2><div class="acc" id="faq-acc-tuotteet"><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tuotteet-p0"><span>Mistä näen pakkauskoon ja säilyvyyden?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tuotteet-p0" hidden="until-found"><p>Rivin Lue lisää avaa kuvauksen, ja tuotesivulla on pakkauskoko, säilyvyys, alkuperä ja ainesosat.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tuotteet-p1"><span>Miksi en löydä tuotetta, jonka tilasin aiemmin?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tuotteet-p1" hidden="until-found"><p>Tuote ei ehkä ole saatavilla valitulle toimituspäivälle. Kokeile toista päivää tai poista suodatin Vain saatavilla. Jos tuote on poistunut valikoimasta, asiakaspalvelu auttaa löytämään korvaavan.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tuotteet-p2"><span>Voinko tilata tuotteita, joita ei ole kaupassa?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tuotteet-p2" hidden="until-found"><p>Kysy asiakaspalvelusta. Osa tuotteista on saatavilla vain tilauksesta tai suuremmissa erissä.</p></div></div><div class="acc__item"><h3 class="acc__h"><button type="button" class="acc__btn" aria-expanded="false" aria-controls="faq-acc-tuotteet-p3"><span>Onko tuotteista tuoteselosteita myymälän omavalvontaan?</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg></span></button></h3><div class="acc__panel" id="faq-acc-tuotteet-p3" hidden="until-found"><p>Tuotesivulla on ainesosat ja ravintosisältö. Laajemmat tuotespesifikaatiot saat asiakaspalvelusta.</p></div></div></div></div></div></div></section><section class="block block--dark on-dark" aria-labelledby="noanswer-title"><div class="container"><div class="noanswer"><h2 id="noanswer-title">Eikö vastaus löytynyt?</h2><p class="lead">Soita tai lähetä sähköpostia, autamme arkisin ma–pe 8–16. Kerro tilausnumero, jos asia koskee tilausta.</p><div class="btns"><a class="btn btn--on-dark" href="#"><span class="cap">Soita asiakaspalveluun</span></a><a class="btn btn--outline-on-dark" href="mailto:asiakaspalvelu@snellman.fi"><span class="cap">Lähetä sähköpostia</span></a></div></div></div></section><section class="block" aria-label="Lisätietoa"><div class="container"><h2 class="vh">Lisätietoa</h2><div class="cols cols--2"><a class="card card--link" href="#"><h3>Tilausehdot</h3><p>Minimitilaus, toimitusalue, muutokset, palautukset ja laskutus yhdellä sivulla.</p><span class="card__go"><span class="btn-text"><span class="cap">Siirry</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a><a class="card card--link" href="#"><h3>Snellman Outlet</h3><p>Lähellä päiväystä olevat erät edullisemmin. Näin osio toimii.</p><span class="card__go"><span class="btn-text"><span class="cap">Siirry</span><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></span></span></a></div></div></section><section class="block block--tight editor-note"><div class="container container--text"></div></section></main>
